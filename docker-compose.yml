version: '3.8'

services:
    db:
        image: postgres:15
        environment:
            POSTGRES_DB: cricketops
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgrespassword
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        restart: unless-stopped

volumes:
    postgres_data:
